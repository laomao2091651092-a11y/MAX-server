server:
  port: 8080

spring:
  # ===== 数据库连接 =====
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/sweet_photos?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false
    username: root
    password: "123456"
    driver-class-name: com.mysql.cj.jdbc.Driver

  # ===== JPA 自动建表 =====
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  # ===== 上传文件大小限制 =====
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

# ===== 照片上传保存目录 =====
upload:
  dir: F:/Web/MAX-server/uploads/
